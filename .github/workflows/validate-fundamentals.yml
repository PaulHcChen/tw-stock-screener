
name: Validate Fundamentals

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate fundamentals for 2330
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: python validate_fundamentals.py

      - name: Calculate fundamentals test
        run: python calculate_fundamentals.py
        
      - name: Check fundamentals data quality
        run: python check_fundamentals_quality.py

      - name: Audit financial statement periods
        run: python audit_fundamentals_periods.py
        

