name: Update TWSE Stock History

on:
  workflow_dispatch:
  schedule:
    # 16:45 Taiwan time, Monday-Friday (UTC is 8 hours behind Taiwan).
    - cron: "45 8 * * 1-5"

permissions:
  contents: write

jobs:
  update-stock-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build latest 60 trading days
        run: python build_stock_history.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock_history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update TWSE stock history"
            git push
          fi
