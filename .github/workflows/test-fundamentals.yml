
name: Test Fundamentals API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-fundamentals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fundamentals API test
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: python build_fundamentals.py

      - name: Commit test output
        run: |
          if git diff --quiet -- data/fundamentals.json; then
            echo "No output changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.json
          git commit -m "Test fundamentals data output"
          git push
