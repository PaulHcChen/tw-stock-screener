
name: Test FinMind API Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Check FinMind API
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("FINMIND_API_TOKEN", "").strip()

          if not token:
              raise SystemExit(
                  "FAIL: FINMIND_API_TOKEN is missing."
              )

          params = {
              "dataset": "TaiwanStockPER",
              "data_id": "2330",
              "start_date": "2025-01-02",
              "token": token,
          }

          url = (
              "https://api.finmindtrade.com/api/v4/data?"
              + urllib.parse.urlencode(params)
          )

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "GitHub-Actions"}
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              raise SystemExit(
                  f"FAIL: API request failed: "
                  f"{type(exc).__name__}"
              )

          if result.get("status") != 200:
              raise SystemExit(
                  "FAIL: FinMind API returned an error. "
                  "Check token and API permissions."
              )

          records = result.get("data", [])

          print("PASS: FinMind API connection successful.")
          print(f"Records returned: {len(records)}")

          if records:
              latest = records[-1]
              print(f"Sample date: {latest.get('date')}")
              print(f"Sample PER: {latest.get('PER')}")
          PY
